name: core-checks
on:
  push:
    branches: [development, Master]
  pull_request:
    branches: [development, Master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-core:
    name: offline-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned startup comparison source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
          path: .local/startup-baseline
          persist-credentials: false
      - name: Install locked development environment
        run: |
          python3 -m venv .ci-tools
          .ci-tools/bin/pip install uv==0.11.2
          .ci-tools/bin/uv sync --frozen --python 3.11
      - name: Check format, lint, types and public documentation
        run: |
          .venv/bin/ruff format --check src tests scripts
          .venv/bin/ruff check src tests scripts
          .venv/bin/mypy
          .venv/bin/python scripts/check-docs.py
          .venv/bin/python scripts/check-agent-guides.py
          .venv/bin/python scripts/research_evidence.py verify
      - name: Test offline contracts and real console entry
        run: .venv/bin/pytest
      - name: Build and verify both distributions in clean environments
        run: |
          .ci-tools/bin/uv build
          .venv/bin/python scripts/verify-distributions.py --uv .ci-tools/bin/uv > dist/verification.jsonl
          cat dist/verification.jsonl
      - name: Enforce startup budgets
        run: |
          .venv/bin/python scripts/check-startup.py --uv .ci-tools/bin/uv --baseline-project .local/startup-baseline --workspace .local/startup-check --output dist/startup.json
      - name: Diagnose a failed startup budget
        if: ${{ failure() }}
        run: |
          if test -f dist/startup.json && test -x .local/startup-check/candidate/env/bin/python; then
            PYTHONHASHSEED=0 PYTHONNOUSERSITE=1 .local/startup-check/candidate/env/bin/python -X importtime .local/startup-check/candidate/env/bin/yorunge capabilities --task llm.train --cached --config examples/profile.toml --state-dir .local/startup-check/candidate-state --output json > /dev/null
            PYTHONHASHSEED=0 PYTHONNOUSERSITE=1 .local/startup-check/candidate/env/bin/python -m cProfile -o dist/cache-startup.prof .local/startup-check/candidate/env/bin/yorunge capabilities --task llm.train --cached --config examples/profile.toml --state-dir .local/startup-check/candidate-state --output json > /dev/null
            .venv/bin/python -c 'import pstats; pstats.Stats("dist/cache-startup.prof").strip_dirs().sort_stats("cumulative").print_stats(35)'
          fi
