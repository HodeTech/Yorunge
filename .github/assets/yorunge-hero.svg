  <ellipse rx="174" ry="71" stroke="url(#orbit)" stroke-width="3.5" stroke-dasharray="360 450" stroke-dashoffset="-82"/>
  <ellipse rx="136" ry="111" stroke="url(#orbit)" stroke-width="2.5" stroke-dasharray="185 600" stroke-dashoffset="12"/>
  <circle cx="163" cy="25" r="7" fill="#68e8d2"/>
  <circle cx="-105" cy="-69" r="5" fill="#bcb4ff"/>
 </g>
 <circle cx="977" cy="152" r="29" fill="#18283e" stroke="#6de0ce" stroke-width="2"/>
 <circle cx="977" cy="152" r="10" fill="#79e5d5"/>
 <g font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="62" font-weight="650" fill="#f4f6ff">
