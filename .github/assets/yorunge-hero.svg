<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-labelledby="title desc">
<title id="title">Veriden sonuca. Aynı yörüngede.</title>
<desc id="desc">Yörünge için lacivert zeminde mor ve turkuaz yörüngelerden oluşan özgün kapak.</desc>
<defs>
