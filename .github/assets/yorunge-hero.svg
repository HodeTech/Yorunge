 <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#55e1cb"/><stop offset=".55" stop-color="#8f88ff"/><stop offset="1" stop-color="#d5b9ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#7770ef" stop-opacity=".26"/><stop offset="1" stop-color="#7770ef" stop-opacity="0"/></radialGradient>
 <clipPath id="edge"><rect width="1200" height="304" rx="20"/></clipPath>
</defs>
<g clip-path="url(#edge)">
 <rect width="1200" height="304" fill="url(#bg)"/>
 <circle cx="974" cy="150" r="250" fill="url(#glow)"/>
