[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "yorunge"
version = "0.1.0.dev0"
description = "Offline planning core for the EVREN companion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.14.1,<3", "PyYAML>=6.0.3,<7"]

[project.scripts]
yorunge = "yorunge.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16", "mypy>=1.19,<2", "types-PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/yorunge"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/examples", "/.github/workflows",
  "/docs/architecture", "/docs/decisions", "/docs/modules", "/docs/reference",
  "/docs/standards", "/docs/roadmap", "/docs/research", "/docs/analysis/README.md",
  "/docs/README.md", "/docs/capability-matrix.md", "/docs/glossary.md",
  "/docs/product-scope.md", "/docs/project-structure.md", "/docs/tech-stack.md",
  "/docs/user-journeys.md", "/docs/vision.md",
  "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/CONTRIBUTING.md",
  "/AGENTS.md", "/CLAUDE.md", "/CHANGELOG.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
